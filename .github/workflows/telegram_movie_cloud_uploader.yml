name: Telegram Cloud Movie Uploader (0% User Net / 0% PC)

on:
  schedule:
    # 100% Automated Auto-Pilot (runs every 10 minutes automatically across all categories)
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Upload Mode (auto = balanced across categories)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'latest'
          - 'all'
          - 'slug'
      movie_slug:
        description: 'Movie Name, Slug, or BollyFlix URL (e.g. war-2019, 3 idiots, https://bollyflix...)'
        required: false
        default: ''
      limit:
        description: 'Target successful movie uploads (Default: 1)'
        required: false
        default: '1'

jobs:
  cloud-upload-to-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout BollyHub Repository
        uses: actions/checkout@v4

      - name: Set up High-Performance Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Telethon & Ultra-Fast Cryptg Engine
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg requests beautifulsoup4 pillow yt-dlp

      - name: Run Telegram Cloud Movie Uploader
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          SLUG="${{ github.event.inputs.movie_slug }}"
          LIMIT="${{ github.event.inputs.limit || '1' }}"
          
          # SMART DISPATCH: If any movie slug, name, or URL is entered, prioritize it immediately!
          if [ -n "$SLUG" ]; then
            echo "🎯 Custom Movie / Search Query Requested: $SLUG"
            python scripts/telegram_cloud_uploader.py --slug "$SLUG"
          elif [ "$MODE" = "all" ]; then
            python scripts/telegram_cloud_uploader.py --all
          elif [ "$MODE" = "latest" ]; then
            python scripts/telegram_cloud_uploader.py --latest --limit "$LIMIT"
          else
            python scripts/telegram_cloud_uploader.py --auto --limit "$LIMIT"
          fi
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '37457570' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'fcd9e2be074ba2e591fbf663f4cec898' }}
          BOLLYHUB_TELEGRAM_BOT_TOKEN: ${{ secrets.BOLLYHUB_TELEGRAM_BOT_TOKEN || '9096712179:AAF2t72UJJQUnW5P12MxDphEHFfWFJd1SV4' }}
          BOLLYHUB_TELEGRAM_CHAT_ID: ${{ secrets.BOLLYHUB_TELEGRAM_CHAT_ID || '-1004487173033' }}
          BOLLYHUB_TELEGRAM_CHANNEL: ${{ secrets.BOLLYHUB_TELEGRAM_CHANNEL || 'https://t.me/+mu3upENk3GFmZTFl' }}
          BOLLYHUB_TRAILER_CHAT_ID: ${{ secrets.BOLLYHUB_TRAILER_CHAT_ID || '-1005650458513' }}
          BOLLYHUB_TRAILER_CHANNEL: ${{ secrets.BOLLYHUB_TRAILER_CHANNEL || 'https://t.me/c/5650458513' }}

      - name: Save Uploaded & Skipped State & Push to Repository
        run: |
          git config --global user.name "BollyHub Cloud Bot"
          git config --global user.email "cloudbot@bollyhub.app"
          git pull --rebase origin main || true
          git add data/telegram_cloud_uploaded.json data/telegram_cloud_skipped.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Update Telegram cloud uploaded & skipped state [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main) || echo "Push skipped (concurrent commit)"
          else
            echo "No changes to commit."
          fi
