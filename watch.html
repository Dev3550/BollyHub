<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Online - BollyHub Live Stream</title>
  <meta name="description" content="Watch movies online in Full HD with multi-audio and subtitle support on BollyHub.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .player-section {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 30px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .server-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 12px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: var(--radius-md);
    }
    .server-label {
      font-weight: 700;
      font-size: 14px;
      color: var(--primary-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .server-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .server-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--primary-gold);
      color: #fff;
    }
    .server-btn.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #f59e0b;
      color: #000;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
    }
    .watch-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--glass-border);
    }
    .btn-download-action {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-download-action:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      <span>🎬</span> BollyHub
    </a>
    <div style="font-size:13px; color:var(--text-muted); display:flex; gap:16px;">
      <a href="stream-player.html" style="color:var(--primary-gold); font-weight:600;">⚡ Cinema Player Demo</a>
      <a href="index.html">← Back to Catalog</a>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="main-container">

    <!-- Cinema Streaming Section -->
    <section class="player-section" id="stream-player-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 id="stream-movie-title" style="font-size:20px; color:#f8fafc; font-weight:700;">
          Loading Stream Player...
        </h2>
        <span class="tag highlight" id="stream-quality-badge">1080p Full HD</span>
      </div>

      <!-- Video Player Frame -->
      <div class="player-wrapper">
        <iframe id="video-embed-frame" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" scrolling="no"></iframe>
      </div>

      <!-- Server Switcher Tabs -->
      <div class="server-bar">
        <div class="server-label">
          <span>⚡ Select Server:</span>
        </div>
        <button class="server-btn active" onclick="switchServer('vidlink')">
          🟢 Server 1 (VidLink HD - Fast Multi-Audio)
        </button>
        <button class="server-btn" onclick="switchServer('vidsrc')">
          ⚡ Server 2 (VidSrc Pro - Cloud Mirror)
        </button>
        <button class="server-btn" onclick="switchServer('2embed')">
          🛡️ Server 3 (SuperEmbed / 2Embed)
        </button>
      </div>

      <!-- Bottom Actions -->
      <div class="watch-actions">
        <div style="color:var(--text-muted); font-size:13px;">
          💡 <em>Tip: If video is buffering, switch to Server 2 or 3 for instant playback.</em>
        </div>
        <a id="stream-download-btn" href="#" class="btn-download-action">
          📥 Download Full Movie
        </a>
      </div>
    </section>

    <!-- Movie Details Section Below Player -->
    <div id="movie-detail-box">
      <!-- Populated dynamically by watch page script -->
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <p>© 2026 BollyHub Engine. High-Speed Permanent Web Streaming.</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    // Known Movie TMDB & IMDb Mapping Registry
    const KNOWN_MOVIE_MAP = {
      'stree-2-sarkate-ka-aatank-2024-hindi-movie': {
        imdb: 'tt27510174',
        tmdb: '1112426',
        defaultTitle: 'Stree 2: Sarkate Ka Aatank (2024)'
      },
      'shaitaan-2024-hindi-movie': {
        imdb: 'tt27744786',
        tmdb: '1187619',
        defaultTitle: 'Shaitaan (2024)'
      },
      'salaar-2023-dual-audio-hindi-telugu-movie': {
        imdb: 'tt13927994',
        tmdb: '770906',
        defaultTitle: 'Salaar: Part 1 - Ceasefire (2023)'
      },
      'deadpool-2-2018-dual-audio-hindi-english-movie': {
        imdb: 'tt5463162',
        tmdb: '383498',
        defaultTitle: 'Deadpool 2 (2018)'
      }
    };

    let currentImdbId = 'tt27510174';
    let currentTmdbId = '1112426';
    let currentActiveServer = 'vidlink';

    function getStreamUrl(server, imdbId, tmdbId) {
      switch (server) {
        case 'vidlink':
          return `https://vidlink.pro/movie/${tmdbId}?primaryColor=f59e0b&secondaryColor=8b5cf6`;
        case 'vidsrc':
          return `https://vidsrc.pm/embed/movie/${imdbId}`;
        case '2embed':
          return `https://2embed.cc/embed/${imdbId}`;
        default:
          return `https://vidlink.pro/movie/${tmdbId}`;
      }
    }

    function switchServer(serverKey) {
      currentActiveServer = serverKey;
      document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.server-btn')).find(b => b.getAttribute('onclick')?.includes(serverKey));
      if (activeBtn) activeBtn.classList.add('active');

      const iframe = document.getElementById('video-embed-frame');
      iframe.src = getStreamUrl(serverKey, currentImdbId, currentTmdbId);
    }

    async function initWatchPage() {
      const urlParams = new URLSearchParams(window.location.search);
      let movieId = urlParams.get('id') || 'stree-2-sarkate-ka-aatank-2024-hindi-movie';

      const movies = await loadMoviesData();
      const movie = movies.find(m => m.id === movieId) || movies.find(m => m.id.includes('stree-2')) || movies[0];

      if (!movie) return;

      const mapping = KNOWN_MOVIE_MAP[movie.id] || {
        imdb: 'tt27510174',
        tmdb: '1112426'
      };

      currentImdbId = mapping.imdb;
      currentTmdbId = mapping.tmdb;

      const cleanTitle = cleanText(movie.title);
      document.title = `Watch ${cleanTitle} Online Free - BollyHub`;
      document.getElementById('stream-movie-title').textContent = `▶️ Now Playing: ${cleanTitle}`;
      
      const dlBtn = document.getElementById('stream-download-btn');
      dlBtn.href = `download.html?id=${encodeURIComponent(movie.id)}`;

      // Load initial stream
      switchServer('vidlink');

      // Render movie details below player
      const detailBox = document.getElementById('movie-detail-box');
      if (detailBox) {
        const fastPoster = getFastPosterUrl(movie.poster_url);
        const categoriesTags = (movie.categories || []).map(c => `<span class="tag highlight">${c}</span>`).join(' ');
        const screenshotsHtml = (movie.screenshots || []).map(img => `<img src="${getFastPosterUrl(img)}" alt="Screenshot" loading="lazy" />`).join('');

        detailBox.innerHTML = `
          <div class="detail-container">
            <div class="detail-poster">
              <img src="${fastPoster}" alt="${cleanTitle}" />
            </div>
            <div class="detail-info">
              <h1>${cleanTitle}</h1>
              <div class="meta-tags">
                <span class="tag">📅 ${movie.release_year || '2024'}</span>
                ${categoriesTags}
              </div>
              <div class="imdb-box">
                <div class="imdb-title">⭐ IMDb Rating: ${movie.imdb?.rating || '7.5'} / 10</div>
                <div><strong>Director:</strong> ${movie.imdb?.director || 'N/A'}</div>
                <div><strong>Cast:</strong> ${(movie.imdb?.cast || []).join(', ')}</div>
                <div><strong>Genres:</strong> ${movie.imdb?.genres || 'Action, Drama'}</div>
              </div>
              <div class="storyline">
                <strong>Storyline:</strong> ${cleanText(movie.imdb?.summary) || 'Watch this movie in high definition with multi-audio online on BollyHub.'}
              </div>
              ${screenshotsHtml ? `<div style="margin-top:24px;"><h3>📸 Screenshots</h3><div class="screenshots-grid">${screenshotsHtml}</div></div>` : ''}
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', initWatchPage);
  </script>
</body>
</html>
